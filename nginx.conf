events {
    worker_connections 1024;
}

http {
    log_format security '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localname;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/(|home|catalog|product|api/status|api/users|api/products|api/orders|search|about|contact|blog|news|help|support)$ {
            return 200 "OK nginx running\n";
        }

        location ~ ^/(nonexistent|fake|invalid|404|wrong|notfound|unknown)$ {
            return 404;
        }

        location ~ ^/(admin|\.env|config\.php|wp-admin|phpmyadmin|\.git|backup\.sql|shell\.php|cmd\.php)$ {
            return 403;
        }

        location ~* "(union.*select|select.*from|drop\s+table|insert\s+into|delete\s+from|--|'.*or.*'='|or 1=1)" {
            return 403;
        }

        location ~* "(<script|onload=|onerror=|javascript:|alert\(|document\.cookie)" {
            return 403;
        }

        location ~ "\.\." {
            return 400;
        }

        location / {
            return 404;
        }
    }
}